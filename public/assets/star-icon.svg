<svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Shining Rays -->
  <line x1="18" y1="2" x2="18" y2="34" stroke="white" stroke-width="1.8" opacity="0.9" filter="url(#starGlow)" stroke-linecap="round"/>
  <line x1="2" y1="18" x2="34" y2="18" stroke="white" stroke-width="1.8" opacity="0.9" filter="url(#starGlow)" stroke-linecap="round"/>
  <line x1="6.5" y1="6.5" x2="29.5" y2="29.5" stroke="white" stroke-width="1.2" opacity="0.75" filter="url(#starGlow)" stroke-linecap="round"/>
  <line x1="29.5" y1="6.5" x2="6.5" y2="29.5" stroke="white" stroke-width="1.2" opacity="0.75" filter="url(#starGlow)" stroke-linecap="round"/>
  <!-- Central Star -->
  <polygon points="18,6 21.5,14 30,15 23.5,20.8 25.5,29 18,24.5 10.5,29 12.5,20.8 6,15 14.5,14" fill="white" filter="url(#starGlow)"/>
  <circle cx="18" cy="18" r="2.5" fill="#8A38F5"/>
</svg>